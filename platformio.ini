;PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
lib_deps =
      MFRC522@1.4.12
      AsyncTCP@3.4.9
      https://github.com/marvinroger/async-mqtt-client#3d93fc7
      FastLED@3.10.3
      ArduinoJson@7.4.2
monitor_speed = 115200
; the library's 4 MHz SPI garbles the reader's registers on the box wiring (stuck reader
; that never sees a chip); 1 MHz is still plenty
build_flags = -DMFRC522_SPICLOCK=1000000u